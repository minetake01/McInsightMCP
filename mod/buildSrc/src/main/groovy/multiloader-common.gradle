plugins {
    id 'java-library'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepositories(
            maven {
                name = 'ParchmentMC'
                url = uri('https://maven.parchmentmc.org/')
            },
            maven {
                name = 'NeoForge'
                url = uri('https://maven.neoforged.net/releases')
            }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = uri('https://maven.blamejared.com')
            }
        }
        filter {
            includeGroup('mezz.jei')
            includeGroup('net.mezzdev.config')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'TerraformersMC'
                url = uri('https://maven.terraformersmc.com/')
            }
        }
        filter { includeGroup('dev.emi') }
    }
    exclusiveContent {
        forRepositories(
            maven {
                name = 'Shedaniel'
                url = uri('https://maven.shedaniel.me/')
            },
            maven {
                name = 'Architectury'
                url = uri('https://maven.architectury.dev/')
            }
        )
        filter {
            includeGroup('me.shedaniel')
            includeGroup('me.shedaniel.cloth')
            includeGroup('dev.architectury')
        }
    }
}

['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        outgoing {
            capability("$group:${base.archivesName.get()}:$version")
            capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
            capability("$group:$mod_id:$version")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(java_version)
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Specification-Title'   : mod_name,
            'Specification-Vendor'  : mod_author,
            'Specification-Version' : project.version,
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : mod_author,
            'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

tasks.named('processResources', ProcessResources) {
    def expandProps = [
        'version'                      : project.version,
        'minecraft_version'            : minecraft_version,
        'minecraft_version_range'      : minecraft_version_range,
        'fabric_loader_version'        : fabric_loader_version,
        'mod_name'                     : mod_name,
        'mod_author'                   : mod_author,
        'mod_id'                       : mod_id,
        'license'                      : license,
        'description'                  : project.description,
        'mod_homepage'                 : mod_homepage,
        'mod_sources'                  : mod_sources,
        'mod_issues'                   : mod_issues,
        'neoforge_loader_version_range': neoforge_loader_version_range,
        'java_version'                 : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
