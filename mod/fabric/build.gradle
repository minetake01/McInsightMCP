plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom-remap'
}

// The e2e runs load the recipe viewer the real game would have and a test-only harness mod; the
// normal dev runs do not, so a developer's own run stays the minimal mod.
sourceSets {
    e2e {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    createRemapConfigurations(sourceSets.e2e)
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        mcinsight_e2e {
            sourceSet sourceSets.e2e
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    compileOnly libs.jei.common.api
    modCompileOnly(variantOf(libs.emi.fabric.api) { classifier('api') })
    modCompileOnly libs.rei.api.fabric
    modCompileOnly libs.rei.plugin.fabric

    modE2eRuntimeOnly libs.jei.fabric
}

// Local-only: '-Pe2e.extraMods=<dir>' adds every jar in that directory to the e2e runs, so a
// developer can try an arbitrary mod set without it becoming part of the deterministic default.
def extraModsDir = providers.gradleProperty('e2e.extraMods').map { file(it) }.getOrNull()
if (extraModsDir != null) {
    dependencies {
        modE2eRuntimeOnly fileTree(dir: extraModsDir, include: '*.jar')
    }
}

loom {
    runs {
        client {
            client()
            displayName = 'Fabric Client'
            generateRunConfig = true
            runDirectory = file('runs/client')
        }
        server {
            server()
            displayName = 'Fabric Server'
            generateRunConfig = true
            runDirectory = file('runs/server')
        }
        // Prepared here, launched by mcp-server/e2e (see exportE2e*Launch below).
        e2eClient {
            client()
            sourceSet = sourceSets.e2e.name
            generateRunConfig = false
            runDirectory = file('runs/e2e-client')
        }
        e2eServer {
            server()
            sourceSet = sourceSets.e2e.name
            generateRunConfig = false
            runDirectory = file('runs/e2e-server')
        }
    }
}

// The runner launches the game itself, without Gradle in between, so it owns the process and can
// stop it. The launch is taken from Loom's own run task after it is configured: its JVM arguments
// (DevLaunchInjector config, side, classpath argument file) are what `runE2e*` would pass.
['e2eClient': 'client', 'e2eServer': 'server'].each { run, side ->
    def Run = run.capitalize()
    def runTask = tasks.named("run${Run}", JavaExec)
    def spec = layout.buildDirectory.file("e2e/${side}.json")
    tasks.register("export${Run}Launch") {
        group = 'e2e'
        dependsOn(tasks.named(side == 'client' ? 'configureClientLaunch' : 'configureLaunch'),
            tasks.named('classes'), tasks.named('e2eClasses'))
        outputs.file(spec)
        outputs.upToDateWhen { false }
        doLast {
            def exec = runTask.get()
            def out = spec.get().asFile
            out.parentFile.mkdirs()
            // Loom passes the classpath through an argument file it writes only when the run task
            // executes, so the export writes the same content next to the spec instead.
            def classpathFile = new File(out.parentFile, "${side}-classpath.txt")
            classpathFile.text = '-classpath\n' + exec.classpath.files*.absolutePath
                .collect { it.replace('\\', '\\\\') }.join(File.pathSeparator) + '\n'
            // Only Loom's own providers: allJvmArgs would also carry Gradle's host defaults (locale, encoding).
            def jvmArgs = exec.jvmArgumentProviders.collectMany { it.asArguments() as List }.findAll { !it.startsWith('@') }
            out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                loader    : 'fabric',
                side      : side,
                java      : exec.javaLauncher.get().executablePath.asFile.absolutePath,
                jvmArgs   : ["@${classpathFile}"] + jvmArgs,
                // Fabric discovers mods on the classpath; McInsight is left out by id instead.
                withMod   : [],
                withoutMod: ["-Dfabric.debug.disableModIds=${mod_id}"],
                mainClass : exec.mainClass.get(),
                args      : exec.args + exec.argumentProviders.collectMany { it.asArguments() as List },
            ]))
        }
    }
}
