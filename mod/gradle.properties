# Options for Gradle itself. Everything the mod is built from lives in
# stonecutter.properties.toml, keyed by Minecraft version and loader.
org.gradle.jvmargs=-Xmx3G
org.gradle.caching=true
org.gradle.parallel=true

# Which Minecraft versions are built, oldest first. The first entry is the base version: the sources
# are written in its names and `stonecutter.gradle` opens a fresh checkout on it. The last entry is
# the newest release, which is what `quick` runs and what the e2e runner treats as "the latest".
# `mcp-server/e2e` and the release workflow read this same key, so a version is added in one place.
minecraft_versions=1.21.1,26.1.2,26.3
