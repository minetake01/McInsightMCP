side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19.0.0,)"
ordering="AFTER"
side="CLIENT"
${optional_viewer_dependency}
[[dependencies.${mod_id}]]
modId="roughlyenoughitems"
type="optional"
versionRange="[16.0.0,)"
ordering="AFTER"
