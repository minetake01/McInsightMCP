version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@types/node"
        versions: [">= 25.0.0"]
  - package-ecosystem: "gradle"
    directory: "/mod"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "gradle-wrapper"
        versions: [">= 9.0.0"]
