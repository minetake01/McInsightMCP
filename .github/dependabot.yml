version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"
    ignore:
      # Typings follow the lowest supported Node (package.json engines), not the newest.
      - dependency-name: "@types/node"
        versions: [">= 23.0.0"]
  - package-ecosystem: "gradle"
    directory: "/mod"
    schedule:
      interval: "weekly"
