name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-server:
    name: MCP Server (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

  mod:
    name: Minecraft Mod (NeoForge & Fabric)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true

      - name: Build NeoForge & Fabric JARs
        run: |
          chmod +x gradlew
          ./gradlew :neoforge:build :fabric:build --no-daemon --stacktrace

      - name: Upload built mod JARs
        uses: actions/upload-artifact@v7
        with:
          name: mod-jars
          path: |
            mod/neoforge/build/libs/mcinsight-neoforge-*.jar
            mod/fabric/build/libs/mcinsight-fabric-*.jar
            !**/build/libs/*-sources.jar
          retention-days: 7
          if-no-files-found: error
