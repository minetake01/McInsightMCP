name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consistency:
    name: Metadata & Docs Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify version synchronization across mod and MCP server
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VER="$(grep -E '^version=' mod/gradle.properties | cut -d'=' -f2- | tr -d '\r')"
          PKG_VER="$(node -p "require('./mcp-server/package.json').version")"
          echo "gradle.properties : ${GRADLE_VER}"
          echo "package.json      : ${PKG_VER}"
          if [[ -z "${GRADLE_VER}" || -z "${PKG_VER}" ]]; then
            echo "::error::A version declaration could not be read."
            exit 1
          fi
          if [[ "${GRADLE_VER}" != "${PKG_VER}" ]]; then
            echo "::error::Version mismatch across mod and MCP server!"
            exit 1
          fi
          # The mod reads its version from the metadata gradle.properties expands, and the MCP server from
          # package.json, so no other declaration exists to drift.
          grep -q "readPackageVersion" mcp-server/src/server.ts
          test -s README.md
          test -s README.ja.md

  mcp-server:
    name: MCP Server (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: mcp-server/package.json

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

  mod:
    name: Minecraft Mod (NeoForge & Fabric)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 21 compiles and runs the mod; 25 runs the Gradle daemon (gradle/gradle-daemon-jvm.properties).
      - name: Setup Java 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Test common & Build NeoForge / Fabric JARs
        run: |
          chmod +x gradlew
          ./gradlew :common:test :neoforge:build :fabric:build --no-daemon --stacktrace

      - name: Upload built mod JARs
        uses: actions/upload-artifact@v7
        with:
          name: mod-jars
          path: |
            mod/neoforge/build/libs/mcinsight-neoforge-*.jar
            mod/fabric/build/libs/mcinsight-fabric-*.jar
            !**/build/libs/*-sources.jar
          retention-days: 7
          if-no-files-found: error
