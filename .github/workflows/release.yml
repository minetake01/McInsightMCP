name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver without leading v, e.g. 0.1.0-beta.1)"
        required: true
        type: string
      release_type:
        description: "Release channel"
        required: true
        default: beta
        type: choice
        options:
          - release
          - beta
          - alpha
      dry_run:
        description: "Build and verify release artifacts without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build & Verify Release Artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      version_type: ${{ steps.meta.outputs.version_type }}
      mc_version: ${{ steps.meta.outputs.mc_version }}
      java_version: ${{ steps.meta.outputs.java_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
            VERSION_TYPE="${{ inputs.release_type }}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            if [[ "${VERSION}" == *alpha* ]]; then
              VERSION_TYPE="alpha"
            elif [[ "${VERSION}" == *-* ]]; then
              VERSION_TYPE="beta"
            else
              VERSION_TYPE="release"
            fi
          fi

          MC_VERSION="$(grep -E '^minecraft_version=' mod/gradle.properties | cut -d'=' -f2- | tr -d '\r')"
          JAVA_VERSION="$(grep -E '^java_version=' mod/gradle.properties | cut -d'=' -f2- | tr -d '\r')"
          if [[ -z "${VERSION}" || -z "${MC_VERSION}" || -z "${JAVA_VERSION}" ]]; then
            echo "::error::Failed to resolve version (${VERSION}), minecraft_version (${MC_VERSION}), or java_version (${JAVA_VERSION})."
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "version_type=${VERSION_TYPE}"
            echo "mc_version=${MC_VERSION}"
            echo "java_version=${JAVA_VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify version consistency across project files
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.meta.outputs.version }}"

          GRADLE_VER="$(grep -E '^version=' mod/gradle.properties | cut -d'=' -f2- | tr -d '\r')"
          CONST_VER="$(sed -nE 's/.*MOD_VERSION = "([^"]+)".*/\1/p' mod/common/src/main/java/net/minetake/mcinsight/McInsightConstants.java)"
          PKG_VER="$(node -p "require('./mcp-server/package.json').version")"
          SERVER_VER="$(sed -nE "s/.*version: '([^']+)'.*/\1/p" mcp-server/src/server.ts | head -n1)"

          echo "Expected version : ${EXPECTED}"
          echo "gradle.properties: ${GRADLE_VER}"
          echo "McInsightConstants: ${CONST_VER}"
          echo "package.json     : ${PKG_VER}"
          echo "server.ts        : ${SERVER_VER}"

          if [[ "${GRADLE_VER}" != "${EXPECTED}" || "${CONST_VER}" != "${EXPECTED}" || "${PKG_VER}" != "${EXPECTED}" || "${SERVER_VER}" != "${EXPECTED}" ]]; then
            echo "::error::Version mismatch detected! All four version declarations must equal ${EXPECTED}."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml

      - name: Build and test MCP server
        working-directory: mcp-server
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Verify npm package dry-run
        working-directory: mcp-server
        run: |
          cp ../README.md ../LICENSE .
          npm pack --dry-run
          rm -f README.md LICENSE

      - name: Package MCP server archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          PKG_NAME="mcinsight-mcp-server-${VERSION}"
          mkdir -p release-out "stage/${PKG_NAME}"

          cp -r mcp-server/dist "stage/${PKG_NAME}/dist"
          cp mcp-server/package.json mcp-server/pnpm-lock.yaml mcp-server/pnpm-workspace.yaml "stage/${PKG_NAME}/"
          cp LICENSE README.md "stage/${PKG_NAME}/"

          tar -czf "release-out/${PKG_NAME}.tar.gz" -C stage "${PKG_NAME}"
          (cd stage && zip -rq "../release-out/${PKG_NAME}.zip" "${PKG_NAME}")

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true

      - name: Build NeoForge & Fabric mods
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew :neoforge:build :fabric:build --no-daemon --stacktrace

      - name: Collect mod JARs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          MC_VERSION="${{ steps.meta.outputs.mc_version }}"

          NEOFORGE_JAR="mod/neoforge/build/libs/mcinsight-neoforge-${MC_VERSION}-${VERSION}.jar"
          FABRIC_JAR="mod/fabric/build/libs/mcinsight-fabric-${MC_VERSION}-${VERSION}.jar"

          test -f "${NEOFORGE_JAR}"
          test -f "${FABRIC_JAR}"

          cp "${NEOFORGE_JAR}" release-out/
          cp "${FABRIC_JAR}" release-out/

      - name: Extract changelog release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const re = new RegExp(`^## \\[${escaped}\\][^\\n]*\\n([\\s\\S]*?)(?=^## \\[|(?![\\s\\S]))`, "m");
            const match = changelog.match(re);
            const notes = match && match[1].trim()
              ? match[1].trim()
              : `Release v${version} for Minecraft ${{ steps.meta.outputs.mc_version }} (NeoForge & Fabric) + McInsightMCP Server.`;
            fs.writeFileSync("release-out/RELEASE_NOTES.md", notes + "\n", "utf8");
          ' "${VERSION}"

      - name: Verify Modrinth sync payload
        env:
          DRY_RUN: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module - <<'EOF'
          import fs from 'node:fs';

          const repo = process.env.GITHUB_REPOSITORY || 'minetake01/McInsightMCP';
          const blobBase = `https://github.com/${repo}/blob/main`;
          const rawReadme = fs.readFileSync('README.md', 'utf8');
          let inFence = false;
          const rewrittenBody = rawReadme
            .split(/\r?\n/)
            .map((line) => {
              if (/^\s*```/.test(line)) {
                inFence = !inFence;
                return line;
              }
              if (inFence) return line;
              return line.replace(/(\]\()([^)\s]+)(\))/g, (full, prefix, target, suffix) => {
                if (/^(https?:\/\/|#|mailto:)/i.test(target)) {
                  return full;
                }
                const cleanTarget = target.replace(/^\.\//, '');
                return `${prefix}${blobBase}/${cleanTarget}${suffix}`;
              });
            })
            .join('\n');

          const remainingRelative = [...rewrittenBody.matchAll(/\]\(([^)\s]+)\)/g)]
            .map((m) => m[1])
            .filter((u) => !/^(https?:\/\/|#|mailto:)/i.test(u));
          if (remainingRelative.length > 0) {
            throw new Error(`Unrewritten relative Markdown links remain: ${remainingRelative.join(', ')}`);
          }

          const iconBuf = fs.readFileSync('mod/common/src/main/resources/mcinsight.png');
          if (iconBuf.length > 256 * 1024) {
            throw new Error(`Icon exceeds Modrinth 256 KiB limit (${iconBuf.length} bytes).`);
          }
          console.log(`Modrinth payload verified (body=${rewrittenBody.length} chars, icon=${iconBuf.length} bytes).`);
          EOF

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-out/*
          retention-days: 7
          if-no-files-found: error

  publish-github:
    name: Publish GitHub Release
    needs: build-and-verify
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-and-verify.outputs.tag }}
          name: McInsightMCP v${{ needs.build-and-verify.outputs.version }}
          body_path: release-assets/RELEASE_NOTES.md
          prerelease: ${{ needs.build-and-verify.outputs.version_type != 'release' }}
          files: |
            release-assets/mcinsight-neoforge-${{ needs.build-and-verify.outputs.mc_version }}-${{ needs.build-and-verify.outputs.version }}.jar
            release-assets/mcinsight-fabric-${{ needs.build-and-verify.outputs.mc_version }}-${{ needs.build-and-verify.outputs.version }}.jar
            release-assets/mcinsight-mcp-server-${{ needs.build-and-verify.outputs.version }}.tar.gz
            release-assets/mcinsight-mcp-server-${{ needs.build-and-verify.outputs.version }}.zip

  publish-modrinth:
    name: Publish to Modrinth
    needs: [build-and-verify, publish-github]
    if: ${{ inputs.dry_run != true && vars.MODRINTH_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate Modrinth token
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [[ -z "${MODRINTH_TOKEN}" ]]; then
            echo "::error::MODRINTH_PROJECT_ID is set, but secrets.MODRINTH_TOKEN is missing."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Publish NeoForge build to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-assets/mcinsight-neoforge-${{ needs.build-and-verify.outputs.mc_version }}-${{ needs.build-and-verify.outputs.version }}.jar
          name: McInsight ${{ needs.build-and-verify.outputs.version }} (NeoForge)
          version: ${{ needs.build-and-verify.outputs.version }}+neoforge
          version-type: ${{ needs.build-and-verify.outputs.version_type }}
          changelog-file: release-assets/RELEASE_NOTES.md
          loaders: neoforge
          game-versions: ${{ needs.build-and-verify.outputs.mc_version }}
          dependencies: |
            jei(optional)
          fail-mode: fail

      - name: Publish Fabric build to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-assets/mcinsight-fabric-${{ needs.build-and-verify.outputs.mc_version }}-${{ needs.build-and-verify.outputs.version }}.jar
          name: McInsight ${{ needs.build-and-verify.outputs.version }} (Fabric)
          version: ${{ needs.build-and-verify.outputs.version }}+fabric
          version-type: ${{ needs.build-and-verify.outputs.version_type }}
          changelog-file: release-assets/RELEASE_NOTES.md
          loaders: fabric
          game-versions: ${{ needs.build-and-verify.outputs.mc_version }}
          dependencies: |
            fabric-api(required)
            jei(optional)
          fail-mode: fail

      - name: Sync README, license, links, and icon to Modrinth
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.build-and-verify.outputs.version }}
        run: |
          node --input-type=module - <<'EOF'
          import fs from 'node:fs';

          const projectId = process.env.MODRINTH_PROJECT_ID;
          const token = process.env.MODRINTH_TOKEN;
          const repo = process.env.GITHUB_REPOSITORY || 'minetake01/McInsightMCP';
          const blobBase = `https://github.com/${repo}/blob/main`;

          const propsText = fs.readFileSync('mod/gradle.properties', 'utf8');
          const props = {};
          for (const line of propsText.split(/\r?\n/)) {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith('#')) continue;
            const eq = trimmed.indexOf('=');
            if (eq > 0) {
              props[trimmed.slice(0, eq).trim()] = trimmed.slice(eq + 1).trim();
            }
          }

          const rawReadme = fs.readFileSync('README.md', 'utf8');
          let inFence = false;
          const rewrittenBody = rawReadme
            .split(/\r?\n/)
            .map((line) => {
              if (/^\s*```/.test(line)) {
                inFence = !inFence;
                return line;
              }
              if (inFence) return line;
              return line.replace(/(\]\()([^)\s]+)(\))/g, (full, prefix, target, suffix) => {
                if (/^(https?:\/\/|#|mailto:)/i.test(target)) {
                  return full;
                }
                const cleanTarget = target.replace(/^\.\//, '');
                return `${prefix}${blobBase}/${cleanTarget}${suffix}`;
              });
            })
            .join('\n');

          const payload = {
            body: rewrittenBody,
            license_id: props.license || 'MIT',
            license_url: `${blobBase}/LICENSE`,
            source_url: props.mod_sources || `https://github.com/${repo}`,
            issues_url: props.mod_issues || `https://github.com/${repo}/issues`,
          };

          const userAgent = `${repo}/${process.env.VERSION || props.version || '0.1.0-beta.1'} (https://github.com/${repo})`;
          const metaRes = await fetch(`https://api.modrinth.com/v2/project/${encodeURIComponent(projectId)}`, {
            method: 'PATCH',
            headers: {
              Authorization: token,
              'Content-Type': 'application/json',
              'User-Agent': userAgent,
            },
            body: JSON.stringify(payload),
          });
          if (!metaRes.ok) {
            throw new Error(`Modrinth project PATCH failed (${metaRes.status}): ${await metaRes.text()}`);
          }
          console.log(`Updated Modrinth project metadata (${metaRes.status}).`);

          const iconBuf = fs.readFileSync('mod/common/src/main/resources/mcinsight.png');
          const iconRes = await fetch(`https://api.modrinth.com/v2/project/${encodeURIComponent(projectId)}/icon?ext=png`, {
            method: 'PATCH',
            headers: {
              Authorization: token,
              'Content-Type': 'image/png',
              'User-Agent': userAgent,
            },
            body: iconBuf,
          });
          if (!iconRes.ok) {
            throw new Error(`Modrinth icon PATCH failed (${iconRes.status}): ${await iconRes.text()}`);
          }
          console.log(`Updated Modrinth project icon (${iconRes.status}, ${iconBuf.length} bytes).`);
          EOF

  publish-curseforge:
    name: Publish to CurseForge
    needs: [build-and-verify, publish-github]
    if: ${{ inputs.dry_run != true && vars.CURSEFORGE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate CurseForge token
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [[ -z "${CURSEFORGE_TOKEN}" ]]; then
            echo "::error::CURSEFORGE_PROJECT_ID is set, but secrets.CURSEFORGE_TOKEN is missing."
            exit 1
          fi

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Publish NeoForge build to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-assets/mcinsight-neoforge-${{ needs.build-and-verify.outputs.mc_version }}-${{ needs.build-and-verify.outputs.version }}.jar
          name: McInsight ${{ needs.build-and-verify.outputs.version }} (NeoForge)
          version: ${{ needs.build-and-verify.outputs.version }}+neoforge
          version-type: ${{ needs.build-and-verify.outputs.version_type }}
          changelog-file: release-assets/RELEASE_NOTES.md
          loaders: neoforge
          game-versions: ${{ needs.build-and-verify.outputs.mc_version }}
          java: Java ${{ needs.build-and-verify.outputs.java_version }}
          environment: client | server
          dependencies: |
            jei(optional)
          fail-mode: fail

      - name: Publish Fabric build to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-assets/mcinsight-fabric-${{ needs.build-and-verify.outputs.mc_version }}-${{ needs.build-and-verify.outputs.version }}.jar
          name: McInsight ${{ needs.build-and-verify.outputs.version }} (Fabric)
          version: ${{ needs.build-and-verify.outputs.version }}+fabric
          version-type: ${{ needs.build-and-verify.outputs.version_type }}
          changelog-file: release-assets/RELEASE_NOTES.md
          loaders: fabric
          game-versions: ${{ needs.build-and-verify.outputs.mc_version }}
          java: Java ${{ needs.build-and-verify.outputs.java_version }}
          environment: client | server
          dependencies: |
            fabric-api(required)
            jei(optional)
          fail-mode: fail

  publish-npm:
    name: Publish MCP Server to npm
    needs: [build-and-verify, publish-github]
    if: ${{ inputs.dry_run != true && vars.ENABLE_NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml

      - name: Build MCP server
        working-directory: mcp-server
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Stage README and LICENSE for npm package
        working-directory: mcp-server
        run: cp ../README.md ../LICENSE .

      - name: Publish to npm
        working-directory: mcp-server
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION_TYPE: ${{ needs.build-and-verify.outputs.version_type }}
        run: |
          set -euo pipefail
          if [[ "${VERSION_TYPE}" == "release" ]]; then
            DIST_TAG="latest"
          else
            DIST_TAG="${VERSION_TYPE}"
          fi

          if [[ -n "${NPM_TOKEN}" ]]; then
            trap 'rm -f .npmrc' EXIT
            printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > .npmrc
            npm publish --access public --provenance --tag "${DIST_TAG}"
          else
            # Uses npm Trusted Publishing (OIDC) configured on npmjs.com
            npm publish --access public --tag "${DIST_TAG}"
          fi
