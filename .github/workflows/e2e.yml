name: E2E

# Real Minecraft, headless: the mod's dev runtime is launched with a virtual display and software
# OpenGL, the MCP server drives it, and every check goes through MCP the way an agent would.
#
# Pull requests and pushes run the `quick` preset (NeoForge singleplayer). The full matrix is the
# `release` preset, run on demand and before a release; select any preset when dispatching.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      preset:
        description: 'quick | multiplayer | release'
        required: true
        default: release
  workflow_call:
    inputs:
      preset:
        type: string
        default: release

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ inputs.preset || 'quick' }})
    runs-on: ubuntu-latest
    # Superseded pull-request runs are cancelled; a release's run (event_name differs) never is.
    concurrency:
      group: e2e-${{ github.event_name }}-${{ github.ref }}-${{ inputs.preset || 'quick' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install virtual display and software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri

      # 21 compiles and runs the mod; 25 runs the Gradle daemon (gradle/gradle-daemon-jvm.properties).
      - name: Setup Java 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: mcp-server/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml

      - name: Install MCP server dependencies
        working-directory: mcp-server
        run: pnpm install --frozen-lockfile

      - name: Run E2E
        working-directory: mcp-server
        env:
          MCINSIGHT_E2E_XVFB: '1'
        run: |
          chmod +x ../mod/gradlew
          node e2e/run.mjs --preset "${{ inputs.preset || 'quick' }}"

      - name: Upload game and MCP logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ inputs.preset || 'quick' }}
          path: |
            mod/*/runs/e2e/*/logs/
            mod/*/runs/e2e/*/*/logs/
            mod/*/runs/e2e/*/*/crash-reports/
          retention-days: 7
          if-no-files-found: ignore
